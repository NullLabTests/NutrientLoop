version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NUTRIENT_API_KEY=${NUTRIENT_API_KEY}
      - NUTRIENT_EXTRACTION_API_KEY=${NUTRIENT_EXTRACTION_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
